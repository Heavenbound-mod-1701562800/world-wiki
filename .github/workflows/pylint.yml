name: pylint

on:
  pull_request:
    paths:
      - "api/**"
      - "libs/**"
      - "models/**"
      - "scripts/**"
      - "config.py"
      - "requirements.txt"
      - "requirements-test.txt"
      - ".pylintrc"
      - ".github/workflows/pylint.yml"
  push:
    paths:
      - "api/**"
      - "libs/**"
      - "models/**"
      - "scripts/**"
      - "config.py"
      - "requirements.txt"
      - "requirements-test.txt"
      - ".pylintrc"
      - ".github/workflows/pylint.yml"

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt
      - name: Pylint
        run: pylint api libs models scripts config.py
